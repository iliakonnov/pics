<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Альбом</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="./assets/app.css">
</head>
<body>
<header class="top-bar">
  <h1 class="site-title" id="album-title">Альбом</h1>
</header>
<main>
  <div id="face-filter" class="face-filter" role="radiogroup" aria-label="Фильтр по людям" hidden></div>
  <div id="burst-grid" class="burst-grid" aria-live="polite"></div>
  <p id="empty-state" class="empty-state" hidden>В альбоме пока нет фотографий.</p>
</main>

<section id="viewer" class="viewer" hidden>
  <div class="viewer-toolbar">
    <button id="viewer-close" class="icon-btn" aria-label="Закрыть" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
    <div id="viewer-info" class="viewer-info"></div>
    <a id="viewer-clip" class="text-btn" target="_blank" rel="noopener" hidden
       aria-label="Открыть серию видеофайлом в новой вкладке"
       title="Открыть серию видеофайлом в новой вкладке (в реальной скорости)">MP4</a>
    <div id="viewer-download-dropdown" class="dropdown">
      <button id="viewer-download-toggle" class="icon-btn" type="button"
              aria-haspopup="true" aria-expanded="false"
              aria-label="Скачать оригинал" title="Скачать оригинал">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v10m-4-3.5L12 15l4-4.5M5 19h14"/></svg>
      </button>
      <div id="viewer-download-menu" class="dropdown-menu" role="menu" hidden>
        <a id="viewer-download-jpg" class="dropdown-item" target="_blank" rel="noopener" role="menuitem" hidden>JPG</a>
        <a id="viewer-download-raw" class="dropdown-item" target="_blank" rel="noopener" role="menuitem" hidden>RAW</a>
        <a id="viewer-download-video" class="dropdown-item" target="_blank" rel="noopener" role="menuitem" hidden>Видео</a>
      </div>
    </div>
  </div>
  <div id="viewer-stage" class="viewer-stage">
    <button id="viewer-prev-burst" class="nav-btn nav-prev" aria-label="Предыдущая серия" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <div id="viewer-media" class="viewer-media"></div>
    <button id="viewer-next-burst" class="nav-btn nav-next" aria-label="Следующая серия" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
    </button>
  </div>
  <div id="filmstrip-wrap" class="filmstrip-wrap" hidden>
    <div id="filmstrip" class="filmstrip" hidden></div>
    <!-- Sits in the empty space either side of the thumbnails to advertise
         the drag-to-shuttle gesture, which is otherwise invisible. -->
    <div id="strip-hint" class="strip-hint" aria-hidden="true">
      <span class="strip-hint-side strip-hint-left">
        <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>
        <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>
        <i class="strip-hint-dot"></i>
      </span>
      <span class="strip-hint-side strip-hint-right">
        <i class="strip-hint-dot"></i>
        <svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg>
        <svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg>
      </span>
    </div>
  </div>
</section>

<script type="module" src="./assets/album-page.js"></script>
</body>
</html>
